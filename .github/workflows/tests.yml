name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      # колесо ставится отдельно от исходников: просмотрщик и сервер должны быть внутри пакета
      - run: pip install "$(ls dist/*.whl)[server]"
      - run: |
          cd "$RUNNER_TEMP"
          python -c "import cherrybim.server.app as a; assert (a.STATIC / 'index.html').is_file()"
          python -m cherrybim.server --help > /dev/null

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,ifc,server]"
      - run: pytest -q
      # схема и демо-пакеты собираются из кода: в репозитории должны лежать свежие
      - name: schema and demo are up to date
        if: matrix.python == '3.13'
        run: |
          python tools/export_schema.py
          python examples/demo/build_demo.py
          git diff --exit-code -- schema examples
