[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cherry-bim"
version = "0.5.4"
description = "Открытое ядро цифрового двойника жилья: от квартала до полки в шкафу"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]
keywords = ["digital twin", "bim", "ifc", "home assistant", "inventory", "geojson"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8", "numpy"]
# сервер: просмотрщик, API вещей, MCP. mcp 2.x переименовал FastMCP, поэтому <2
server = ["mcp>=1.26,<2", "uvicorn>=0.30", "httpx>=0.27", "websockets>=13", "pillow>=10.1"]
dev = ["pytest>=8"]

[project.scripts]
cherrybim-server = "cherrybim.server.app:main"

[project.urls]
Homepage = "https://github.com/beanbo/cherry-bim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cherrybim.server" = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*", "static/vendor/jsm/*/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
