[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cherry-bim"
version = "0.1.0"
description = "Открытое ядро цифрового двойника жилья: от квартала до полки в шкафу"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]
keywords = ["digital twin", "bim", "ifc", "home assistant", "inventory", "geojson"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8", "numpy"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/beanbo/cherry-bim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
