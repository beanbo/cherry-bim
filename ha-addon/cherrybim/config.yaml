# Локальный аддон Home Assistant: 3D-двойник жилья, учёт вещей и MCP для голосового ассистента.
# Скопируйте папку в /addons на HA (шара Samba «addons»), «Магазин аддонов → ⋮ → Проверить обновления»,
# установите «Cherry BiM». Пакеты двойника положите в /share/cherrybim/packages. Описание — DOCS.md.
version: 0.3.3
slug: cherrybim
name: Cherry BiM
description: 3D-план жилья, учёт вещей «что где лежит», MCP-инструменты для голосового ассистента
url: https://github.com/beanbo/cherry-bim
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:home-search
panel_title: Квартира
homeassistant_api: true
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
options:
  packages: /share/cherrybim/packages
  data: /share/cherrybim
  ai_task: ""
  show_script: ""
  audience: household
schema:
  packages: str
  data: str
  ai_task: str?
  show_script: str?
  audience: list(public|residents|household|owner)
